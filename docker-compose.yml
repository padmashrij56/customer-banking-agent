# PROVIDED, COMPLETE (Scope Decision 4). See Dockerfile.
services:
  loan-underwriting-platform:
    build: .
    image: loan-underwriting-platform:local
    container_name: loan-underwriting-platform
    ports:
      # Host 8502 -> container 8501, so the containerized portal doesn't
      # collide with a local `streamlit run` (which uses 8501) during the lab.
      - "8502:8501"
    env_file:
      - .env
    volumes:
      # Mount data/ read-write so the mock business-data JSON files can be
      # inspected/edited without rebuilding the image during the lab.
      - ./data:/app/data
    restart: unless-stopped
